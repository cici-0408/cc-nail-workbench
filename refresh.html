<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cc Nail 刷新中</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff8fb;
      color: #4b2d39;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    main {
      width: min(88vw, 420px);
      padding: 28px;
      border: 1px solid rgba(191, 93, 134, 0.22);
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 16px 38px rgba(166, 82, 118, 0.12);
    }
    h1 { color: #bf5d86; }
    a {
      color: #bf5d86;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>正在更新 Cc Nail</h1>
    <p>正在清理旧版本缓存，马上跳转到新版预约页。</p>
    <p><a id="fallback" href="./?v=manual-refresh-v22#booking">如果没有自动跳转，点这里打开新版</a></p>
  </main>
  <script>
    async function refreshApp() {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
      } catch {}
      location.replace("./?v=manual-refresh-v22#booking");
    }
    refreshApp();
  </script>
</body>
</html>
